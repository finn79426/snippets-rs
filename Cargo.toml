[package]
name = "snippet-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
bitcoin = "0.32.7"
bs58 = "0.5.1"
hex = "0.4.3"
once_cell = "1.21.3"
regex = "1.12.2"
sha2 = "0.10.9"
sha3 = "0.10.8"
reqwest = { version = "0.12.24", features = ["json"] }
tokio = { version = "1.48.0", features = ["macros"] }
serde = "1.0"
serde_json = "1.0"
chrono = "0.4"
alloy = { version = "1.1.2", features = ["provider-ws", "rpc", "sol-types"] }
eyre = "0.6.12"
url = "2.5.7"
